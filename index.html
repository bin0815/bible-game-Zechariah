<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>撒迦利亞書翻牌對對樂</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            background-color: #f0f8ff; 
            margin: 0; 
            padding: 10px; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; 
        }
        h1 { margin: 5px 0; color: #2c3e50; font-size: 1.5rem; }
        .menu { margin-bottom: 8px; }
        .menu button { background-color: #7f8c8d; color: white; border: none; padding: 6px 15px; margin: 0 4px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
        .menu button.active { background-color: #2980b9; font-weight: bold; }
        .stats { font-size: 1rem; margin-bottom: 8px; font-weight: bold; color: #34495e; }
        
        .grid { 
            display: grid; 
            gap: 8px; 
            max-width: 950px; 
            width: 100%;
            margin: 0 auto; 
            flex-grow: 1;
            padding-bottom: 10px;
            align-content: center;
            justify-content: center;
        }
        
        /* 嚴格對應張數的網格版面 */
        .grid.mode-10 { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); } 
        .grid.mode-20 { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); } 
        .grid.mode-30 { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); } 

        .card { 
            background-color: #4a90e2; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 0.8rem; 
            font-weight: bold; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.15); 
            user-select: none; 
            aspect-ratio: 1; 
            padding: 4px;
        }
        .card.flipped { background-color: white; color: #333; transform: none; }
        .card.blue { border: 3px solid #4a90e2; }
        .card.orange { border: 3px solid #f39c12; }
        .card .icon { font-size: 1.6rem; margin-bottom: 2px; }
        .card.matched { visibility: hidden; }
    </style>
</head>
<body>

    <h1>撒迦利亞書冒險挑戰</h1>
    
    <div class="menu">
        <button id="btn-10" onclick="setDifficulty(10)">簡單 (10張)</button>
        <button id="btn-20" onclick="setDifficulty(20)">中等 (20張)</button>
        <button id="btn-30" onclick="setDifficulty(30)">挑戰 (30張)</button>
    </div>

    <div class="stats">次數: <span id="moves">0</span> | 時間: <span id="timer">0</span>秒</div>
    <div class="grid" id="gameGrid"></div>

    <script>
        // 定義完整的 15 組配對資料庫
        const masterPairs = [
            { id: 1, blue: { text: "騎驢的王", icon: "👑" }, orange: { text: "和平耶穌", icon: "🕊️" } },
            { id: 2, blue: { text: "金燈臺", icon: "💡" }, orange: { text: "聖靈的光", icon: "✨" } },
            { id: 3, blue: { text: "保護的眼", icon: "👁️" }, orange: { text: "上帝守護", icon: "🛡️" } },
            { id: 4, blue: { text: "飛翔書卷", icon: "📜" }, orange: { text: "潔淨罪惡", icon: "🧹" } },
            { id: 5, blue: { text: "好牧人", icon: "🐑" }, orange: { text: "照顧羊群", icon: "❤️" } },
            { id: 6, blue: { text: "整理房間", icon: "🏠" }, orange: { text: "丟掉吵架", icon: "🗑️" } },
            { id: 7, blue: { text: "公義天平", icon: "⚖️" }, orange: { text: "誠實公平", icon: "🤝" } },
            { id: 8, blue: { text: "閃耀冠冕", icon: "👑" }, orange: { text: "榮耀勝利", icon: "🌟" } },
            { id: 9, blue: { text: "禱告的手", icon: "🙏" }, orange: { text: "悄悄話", icon: "💬" } },
            { id: 10, blue: { text: "愛鄰舍", icon: "🌍" }, orange: { text: "幫助別人", icon: "🎁" } },
            { id: 11, blue: { text: "活水泉源", icon: "💧" }, orange: { text: "上帝生命", icon: "🌱" } },
            { id: 12, blue: { text: "堅固城牆", icon: "🧱" }, orange: { text: "平安記號", icon: "🏳️" } },
            { id: 13, blue: { text: "清晨日光", icon: "🌅" }, orange: { text: "帶來希望", icon: "🌻" } },
            { id: 14, blue: { text: "喜樂油", icon: "🏺" }, orange: { text: "代替悲傷", icon: "😊" } },
            { id: 15, blue: { text: "新耶路撒冷", icon: "🏰" }, orange: { text: "永遠同住", icon: "👼" } }
        ];

        let currentCardCount = 10;
        let moves = 0, timer = 0, flippedCards = [], matchedCount = 0;
        let timerInterval = null;
        let isChecking = false;

        function setDifficulty(count) {
            currentCardCount = count;
            document.querySelectorAll('.menu button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${count}`).classList.add('active');
            initGame();
        }

        function initGame() {
            clearInterval(timerInterval);
            timer = 0;
            moves = 0;
            matchedCount = 0;
            flippedCards = [];
            isChecking = false;
            document.getElementById('timer').innerText = timer;
            document.getElementById('moves').innerText = moves;

            timerInterval = setInterval(() => { 
                timer++; 
                document.getElementById('timer').innerText = timer; 
            }, 1000);

            // 1. 決定要幾組（10張=5組, 20張=10組, 30張=15組）
            let neededPairs = currentCardCount / 2;
            let activePairs = masterPairs.slice(0, neededPairs);

            // 2. 把每一組的「藍卡」與「橘卡」確實建立並推入遊戲陣列中
            let gameData = [];
            activePairs.forEach(pair => {
                gameData.push({ id: pair.id, text: pair.blue.text, icon: pair.blue.icon, type: "blue" });
                gameData.push({ id: pair.id, text: pair.orange.text, icon: pair.orange.icon, type: "orange" });
            });

            // 3. 隨機洗牌
            gameData.sort(() => Math.random() - 0.5);

            // 4. 渲染到畫面上
            const grid = document.getElementById('gameGrid');
            grid.className = `grid mode-${currentCardCount}`;
            grid.innerHTML = '';

            gameData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<span>?</span>`;
                div.dataset.id = item.id;
                div.dataset.text = item.text;
                div.dataset.icon = item.icon;
                div.dataset.type = item.type;
                div.onclick = flip;
                grid.appendChild(div);
            });
        }

        function flip() {
            if (isChecking) return; 
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return; 

            this.classList.add('flipped', this.dataset.type);
            this.innerHTML = `<div class="icon">${this.dataset.icon}</div>${this.dataset.text}`;
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isChecking = true;
            const [c1, c2] = flippedCards;

            // 只要兩張牌的 id 相同，就代表成功配對！
            if (c1.dataset.id === c2.dataset.id) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                matchedCount += 2;
                flippedCards = [];
                isChecking = false;

                if (matchedCount === currentCardCount) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        alert(`🎉 太棒了！挑戰成功！\n總共花費 ${timer} 秒，翻牌 ${moves} 次！`);
                    }, 300);
                }
            } else {
                // 配對失敗，1秒後自動蓋回問號
                setTimeout(() => {
                    c1.classList.remove('flipped', 'blue', 'orange'); 
                    c1.innerHTML = '<span>?</span>';
                    c2.classList.remove('flipped', 'blue', 'orange'); 
                    c2.innerHTML = '<span>?</span>';
                    flippedCards = [];
                    isChecking = false;
                }, 1000);
            }
        }

        // 預設載入時選中 10 張
        setDifficulty(10);
    </script>
</body>
</html>
