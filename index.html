<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
撒迦利亞書下半部翻牌對對樂 V1.1
</title>


<style>

body{

margin:0;

font-family:
"Noto Sans TC",
"Microsoft JhengHei",
sans-serif;

background:
linear-gradient(#cceeff,#fff);

text-align:center;

color:#444;

}


h1{

color:#754c24;

}


.menu button{

font-size:20px;

padding:12px 25px;

margin:10px;

border-radius:25px;

border:none;

background:#f6c453;

cursor:pointer;

}


.menu button:hover{

transform:scale(1.05);

}



.info{

font-size:20px;

margin:15px;

}



.game{

display:grid;

gap:12px;

justify-content:center;

padding:20px;

}



.card{

width:100px;

height:130px;

perspective:800px;

cursor:pointer;

}



.inner{

width:100%;

height:100%;

position:relative;

transition:.5s;

transform-style:preserve-3d;

}



.card.flip .inner{

transform:rotateY(180deg);

}



.front,
.back{

position:absolute;

width:100%;

height:100%;

border-radius:18px;

display:flex;

align-items:center;

justify-content:center;

backface-visibility:hidden;

}



.front{

background:white;

border:3px solid #d89b27;

font-size:45px;

}



.back{

background:#ffe9a6;

transform:rotateY(180deg);

font-size:18px;

padding:10px;

}



.done .back{

background:#b7e7b0;

}



.story{

display:none;

position:fixed;

left:50%;

top:50%;

transform:translate(-50%,-50%);

background:white;

padding:25px;

width:80%;

max-width:400px;

border-radius:20px;

box-shadow:0 0 20px #999;

}



.story h2{

color:#b06b00;

}



.result{

display:none;

font-size:28px;

padding:30px;

}



@media(max-width:600px){

.card{

width:75px;

height:100px;

}

}


</style>


</head>


<body>


<h1>
📖 撒迦利亞書下半部<br>
👑 神應許的君王來了！
</h1>



<div class="menu">


<button onclick="startGame(5)">
🟢 簡單<br>
10張
</button>


<button onclick="startGame(10)">
🟡 中級<br>
20張
</button>


<button onclick="startGame(15)">
🔴 困難<br>
30張
</button>


</div>



<div class="info">

⏱
<span id="time">
00:00
</span>

<br>

翻牌：

<span id="move">
0
</span>

次


</div>



<div id="game" class="game"></div>



<div id="story" class="story">

<h2 id="storyTitle"></h2>

<p id="storyText"></p>

<p id="verse"></p>


<button onclick="closeStory()">
繼續遊戲
</button>

</div>



<div id="result" class="result">

🎉🎉🎉

<h2>
完成啦！
</h2>


<p>
你認識了神應許的君王！
</p>


<p>
👑 耶穌愛你，永遠陪伴你。
</p>


<button onclick="location.reload()">
再玩一次
</button>


</div>




<script>


const bibleCards=[


{
icon:"🫏",
title:"謙卑的君王",
text:"耶穌騎著驢子來到百姓中間，祂是一位愛人的君王。",
verse:"撒迦利亞書 9:9"
},


{
icon:"👑",
title:"神應許的君王",
text:"神答應要差派一位特別的君王，拯救祂的百姓。",
verse:"撒迦利亞書 9章"
},


{
icon:"🐑",
title:"愛我們的牧人",
text:"神像牧人照顧羊一樣，看顧祂的孩子。",
verse:"撒迦利亞書 10章"
},


{
icon:"❤️",
title:"神沒有忘記",
text:"即使人遇到困難，神仍然記得祂的應許。",
verse:"撒迦利亞書 9-10章"
},


{
icon:"💧",
title:"生命泉源",
text:"神要潔淨我們，給我們新的生命。",
verse:"撒迦利亞書 13:1"
},


{
icon:"💰",
title:"三十塊銀子",
text:"這預告耶穌後來被人出賣。",
verse:"撒迦利亞書 11:12"
},


{
icon:"✝️",
title:"受傷的牧人",
text:"耶穌為了愛我們，願意受苦。",
verse:"撒迦利亞書 13:7"
},


{
icon:"🛡️",
title:"神保護百姓",
text:"神是我們的力量和保護。",
verse:"撒迦利亞書 12章"
},


{
icon:"☀️",
title:"神帶來盼望",
text:"神讓黑暗變成光明。",
verse:"撒迦利亞書 14章"
},


{
icon:"🌎",
title:"神掌管全世界",
text:"最後所有人都知道神是真正的王。",
verse:"撒迦利亞書 14:9"
}


];

let firstCard = null;
let secondCard = null;

let lockBoard = false;

let moves = 0;

let matched = 0;

let totalCards = 0;

let seconds = 0;

let timer;



// 開始遊戲

function startGame(level){


document.querySelector(".menu").style.display="none";


let selectedCards =
bibleCards.slice(0,level);



let gameCards=[];



selectedCards.forEach((item,index)=>{


// 圖片卡

gameCards.push({

id:index,

content:item.icon,

type:"image",

data:item

});



// 故事卡

gameCards.push({

id:index,

content:item.title,

type:"text",

data:item

});


});



// 隨機排列

gameCards.sort(()=>Math.random()-0.5);



totalCards=gameCards.length;



createCards(gameCards);



startTimer();



}



// 建立卡片

function createCards(cards){


const game =
document.getElementById("game");


game.innerHTML="";



game.style.gridTemplateColumns=
"repeat(auto-fit,minmax(80px,100px))";



cards.forEach(card=>{


let div =
document.createElement("div");



div.className="card";



div.innerHTML=`

<div class="inner">

<div class="front">
❓
</div>


<div class="back">

${card.content}

</div>

</div>

`;



div.onclick=function(){

flipCard(div,card);

};



game.appendChild(div);



});


}



// 翻牌

function flipCard(card,data){



if(lockBoard)
return;


if(card.classList.contains("flip"))
return;


card.classList.add("flip");



if(!firstCard){


firstCard={

element:card,

data:data

};


return;


}



secondCard={

element:card,

data:data

};



moves++;


document.getElementById("move")
.innerText=moves;



checkMatch();



}



// 判斷是否配對

function checkMatch(){



if(firstCard.data.id === secondCard.data.id){



playSound("success");



firstCard.element.classList.add("done");

secondCard.element.classList.add("done");



matched+=2;



showStory(firstCard.data.data);



resetTurn();



if(matched===totalCards){


finishGame();


}



}

else{


playSound("wrong");


lockBoard=true;



setTimeout(()=>{


firstCard.element.classList.remove("flip");

secondCard.element.classList.remove("flip");

resetTurn();



},1000);



}



}





// 顯示故事

function showStory(data){



document.getElementById("storyTitle")
.innerText=data.title;



document.getElementById("storyText")
.innerText=data.text;



document.getElementById("verse")
.innerText="📖 "+data.verse;



document.getElementById("story")
.style.display="block";



}




function closeStory(){


document.getElementById("story")
.style.display="none";


}



// 重置翻牌

function resetTurn(){


firstCard=null;

secondCard=null;

lockBoard=false;


}



// 計時

function startTimer(){


seconds=0;


timer=setInterval(()=>{


seconds++;


let min=
Math.floor(seconds/60);



let sec=
seconds%60;



document.getElementById("time")
.innerText=

String(min).padStart(2,"0")
+
":"
+
String(sec).padStart(2,"0");



},1000);



}



// 完成遊戲

function finishGame(){



clearInterval(timer);



setTimeout(()=>{


document.getElementById("game")
.style.display="none";


document.querySelector(".info")
.style.display="none";



document.getElementById("result")
.style.display="block";



},800);



}



// 音效

function playSound(type){



let audio =
new Audio();



if(type==="success"){


audio.src=
"data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQQAAAAA";


}


else{


audio.src=
"data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQQAAAAA";


}



audio.play();



}
