<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>撒迦利亞書翻牌對對樂</title>

<style>

*{
 box-sizing:border-box;
 font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
}

body{
 margin:0;
 background:linear-gradient(#bde7ff,#ffffff);
 text-align:center;
 color:#333;
}


h1{
 color:#7b4b21;
 margin-top:20px;
}


.menu{
 margin:20px;
}


button{
 padding:12px 25px;
 margin:8px;
 border:none;
 border-radius:20px;
 background:#f2b84b;
 font-size:18px;
 cursor:pointer;
}


button:hover{
 transform:scale(1.05);
}


.info{

font-size:20px;
margin:15px;

}


.game{

display:grid;
gap:12px;
justify-content:center;
padding:15px;

}


.card{

width:100px;
height:130px;
perspective:800px;
cursor:pointer;

}


.card-inner{

position:relative;
width:100%;
height:100%;
transition:.5s;
transform-style:preserve-3d;

}


.card.flip .card-inner{

transform:rotateY(180deg);

}


.front,
.back{

position:absolute;
width:100%;
height:100%;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
backface-visibility:hidden;
font-size:45px;

}


.front{

background:#ffffff;
border:3px solid #e2a23b;

}


.back{

background:#ffe7a8;
transform:rotateY(180deg);
font-size:18px;
padding:10px;

}


.card.done .back{

background:#a8e6a1;

}



#result{

display:none;

font-size:28px;

background:white;

padding:30px;

border-radius:20px;

margin:20px;

}


.fire{

font-size:50px;

animation:bounce 1s infinite;

}


@keyframes bounce{

50%{
transform:translateY(-15px);
}

}



@media(max-width:600px){

.card{

width:75px;
height:100px;

}

.front{

font-size:35px;

}

}


</style>

</head>


<body>


<h1>
📖 撒迦利亞書下半部<br>
神應許的君王來了！
</h1>


<div class="menu" id="menu">

<button onclick="startGame(5)">
🟢 簡單<br>10張卡
</button>


<button onclick="startGame(10)">
🟡 中級<br>20張卡
</button>


<button onclick="startGame(15)">
🔴 困難<br>30張卡
</button>


</div>



<div class="info">

⏱ 時間：
<span id="time">00:00</span>

<br>

翻牌：
<span id="moves">0</span> 次

</div>



<div class="game" id="game"></div>


<div id="result">

<div class="fire">
🎉🎉🎉
</div>

<h2>
恭喜完成！
</h2>


<p>
你認識了神應許的君王！
</p>


<p>
👑 耶穌愛你、保護你。
</p>


<button onclick="location.reload()">
再玩一次
</button>


</div>



<script>


const cardsData=[


{
icon:"🫏",
text:"謙卑的君王來了"
},


{
icon:"👑",
text:"神應許的君王"
},


{
icon:"🐑",
text:"神像牧人照顧我們"
},


{
icon:"❤️",
text:"神沒有忘記祂的百姓"
},


{
icon:"💧",
text:"神賜下新的生命"
},


{
icon:"💰",
text:"三十塊銀子"
},


{
icon:"✝️",
text:"耶穌為我們受苦"
},


{
icon:"🛡️",
text:"神保護祂的孩子"
},


{
icon:"☀️",
text:"神帶來盼望"
},


{
icon:"🌎",
text:"神作全地的王"
},


{
icon:"⛲",
text:"罪得潔淨"
},


{
icon:"🔥",
text:"神煉淨我們"
},


{
icon:"🏰",
text:"神保護耶路撒冷"
},


{
icon:"📖",
text:"神的應許"
},


{
icon:"👑✝️",
text:"耶穌永遠作王"
}


];



let first=null;
let second=null;
let lock=false;

let total=0;
let matched=0;

let moves=0;

let seconds=0;

let timer;



function startGame(number){


document.getElementById("menu").style.display="none";


let selected=cardsData.slice(0,number);



let cards=[];


selected.forEach((item,index)=>{


cards.push({
id:index,
show:item.icon
});


cards.push({
id:index,
show:item.text
});


});


cards.sort(()=>Math.random()-0.5);



total=cards.length;

const game=document.getElementById("game");

game.innerHTML="";


game.style.gridTemplateColumns=
`repeat(auto-fit,minmax(80px,100px))`;



cards.forEach(card=>{


let div=document.createElement("div");

div.className="card";


div.innerHTML=`

<div class="card-inner">

<div class="front">
❓
</div>


<div class="back">
${card.show}
</div>


</div>

`;



div.onclick=()=>flip(div,card);


game.appendChild(div);



});


timer=setInterval(()=>{


seconds++;

let m=Math.floor(seconds/60);

let s=seconds%60;


document.getElementById("time")
.innerText=
`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;



},1000);



}



function flip(card,info){


if(lock)return;

if(card.classList.contains("flip"))
return;



card.classList.add("flip");



if(!first){

first={
card:card,
id:info.id
};

return;

}



second={
card:card,
id:info.id
};


moves++;

document.getElementById("moves").innerText=moves;



check();


}



function check(){


if(first.id===second.id){


first.card.classList.add("done");

second.card.classList.add("done");


matched+=2;


reset();


if(matched===total){

finish();

}



}else{


lock=true;


setTimeout(()=>{


first.card.classList.remove("flip");

second.card.classList.remove("flip");


reset();


},900);



}


}



function reset(){

first=null;

second=null;

lock=false;

}



function finish(){


clearInterval(timer);


document.getElementById("result")
.style.display="block";


document.getElementById("game")
.style.display="none";


}



</script>


</body>

</html>
